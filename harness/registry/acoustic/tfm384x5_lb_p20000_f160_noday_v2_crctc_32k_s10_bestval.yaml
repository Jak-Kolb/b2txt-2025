name: tfm384x5_lb_p20000_f160_noday_v2_crctc_32k_s10_bestval
checkpoint_dir: model_training/trained_models/tfm384x5_lb_p20000_f160_noday_v2_crctc_32k_s10_20261112T103245Z/checkpoint
description: 'Fork of gru768_pall_f0_120k_s10_bestval: Corrected LightBeam reproduction
  (masks 5% of trial length, sampled 5-20 s left context, learned relative bias, length-normalized
  CTC, trial-uniform batches, their dropout placement and initialization, no random
  cut), causal smoothing, R = 2, + CR-CTC consistency (weight 0.2), half the batches
  at twice the cost each. See results/harness/queue/tfm_lbfix_20261111.py. 31500-batch
  step schedule (x0.1 at batch 18900), fixed final snapshot (batch 31499, chosen before
  training; no checkpoint selection); val-dev greedy PER and WER at acoustic scales
  0.2 / 0.25 / 0.3 / 0.4 / 0.5 at gen4g.'
training:
