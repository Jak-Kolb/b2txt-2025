name: gru768_head256_pall_f0_20k_s10_bestval
aliases: [la_r0_s10]
checkpoint_dir: model_training/trained_models/la_r0_s10_20261012T170335Z/checkpoint
description: 'Fork of A2: Look-ahead family: causal 5x768 GRU (A2) + 256-unit
  backward GRU over the causal outputs of frames t..t+0 (0 frames = 0 ms of right
  context; 33.3M shared params), A2 seeds. R=0 is the capacity control (same parameters,
  no future). Complete 20k-batch schedule (num_training_batches = lr_decay_steps =
  lr_decay_steps_day = 20000; A2 recipe otherwise). Evaluated at the fixed final
  snapshot (batch 19999, chosen before training; no checkpoint selection) on val-dev
  with gen4g at acoustic scales 0.25/0.3/0.4/0.5/0.6, blank 90, the same grid for
  every anchor.'
training:
  config: results/harness/train/20261012T170335Z_la_r0_s10/config.yaml
  log: model_training/trained_models/la_r0_s10_20261012T170335Z/training_log
  forked_from: gru768_pall_f0_120k_s10_bestval
  overrides:
  - model.lookahead_frames=0
  - model.lookahead_units=256
  - checkpoint_batches=[19999]
  - num_training_batches=20000
  - lr_decay_steps=20000
  - lr_decay_steps_day=20000
  git_head: 00aa85f54f7ad37128d4d8e615cd58cd002fdf0e
  git_dirty: true
  train_dir: results/harness/train/20261012T170335Z_la_r0_s10
selection:
