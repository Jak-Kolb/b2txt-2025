name: tfm384x5_lb_p20000_f1440_60k_s10_bestval
aliases: [lb_tfm_r18_60k_s10]
checkpoint_dir: model_training/trained_models/lb_tfm_r18_60k_s10_20261016T130946Z/checkpoint
description: 'Fork of Z1: LightBeam-recipe causal Transformer with an
  18-frame (1440 ms) look-ahead in the last layer, from scratch at 60k (20k run: greedy
  PER 12.02%, still improving). Seed 10 / dataset seed 1. 60k-batch schedule (num_training_batches
  = lr_decay_steps = lr_decay_steps_day = 60000), fixed final snapshot (batch 59999,
  chosen before training; no checkpoint selection); val-dev greedy PER and WER over
  acoustic scales 0.25-0.6 at gen4g.'
training:
