  - model.transformer.lookahead_frames=18
  - dataset.data_transforms.time_mask_n=20
  - dataset.data_transforms.time_mask_mode=per_trial_frames
  - dataset.data_transforms.time_mask_max_frac=1.0
  - dataset.data_transforms.time_mask_max_len=5
  - checkpoint_batches=[59999]
  - model.patch_size=4
  - model.patch_stride=4
  - model.transformer.d_model=384
  - model.transformer.n_layers=5
  - model.transformer.n_heads=6
  - model.transformer.ffn_mult=4
  - model.transformer.dropout=0.35
  - model.transformer.window=250
  - model.input_network.input_layer_dropout=0.2
  - lr_max=0.002
  - lr_max_day=0.002
  - grad_norm_clip_value=100
  - dataset.data_transforms.white_noise_std=0.2
  - dataset.data_transforms.constant_offset_std=0.05
  - num_training_batches=60000
  - lr_decay_steps=60000
  - lr_decay_steps_day=60000
  git_head: 76ad635094b50bfcfa575ffe2251c51b64b47363
  git_dirty: true
  train_dir: results/harness/train/20261016T130946Z_lb_tfm_r18_60k_s10
selection:
  rule: 'rnn_trainer best greedy-CTC val PER (ties: val loss) over all enabled val
